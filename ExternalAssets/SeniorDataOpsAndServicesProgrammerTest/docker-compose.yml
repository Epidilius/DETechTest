services:
    mongo:
        image: mongo
        container_name: mongo-container
        ports:
            - "27016:27017"
        volumes:
            - ./mongo:/docker-entrypoint-initdb.d

    postgres:
        image: postgres:14
        container_name: postgres-container
        environment:
            POSTGRES_PASSWORD: "password"
        ports:
            - "5433:5432"